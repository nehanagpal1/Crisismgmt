<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
    }
    
    .dashboard-container {
      background: #0f1419;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 40px;
      min-height: 100vh;
    }
    
    /* Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .app-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    .header-title h1 {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      text-align: left;
    }
    
    .header-subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 2px 0 0 0;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .user-info {
      text-align: right;
    }
    
    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      margin: 0;
    }
    
    .user-role {
      font-size: 12px;
      color: #f59e0b;
      margin: 2px 0 0 0;
      font-weight: 600;
    }
    
    .nav-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    
    .nav-btn:hover {
      background: #1e293b;
      border-color: #475569;
      transform: none;
    }
    
    .nav-btn.primary {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #000000;
      font-weight: 600;
    }
    
    .nav-btn.primary:hover {
      background: #d97706;
      border-color: #d97706;
    }
    
    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px 24px;
      transition: all 0.3s;
    }
    
    .stat-card:hover {
      border-color: #f59e0b;
      transform: translateY(-2px);
    }
    
    .stat-label {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }
    
    .stat-value.orange { color: #f59e0b; }
    .stat-value.blue { color: #3b82f6; }
    .stat-value.green { color: #10b981; }
    .stat-value.purple { color: #a855f7; }
    
    /* Quick Actions */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    
    .action-card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
    }
    
    .action-card:hover {
      border-color: #f59e0b;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
    }
    
    .action-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    
    .action-title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 6px 0;
    }
    
    .action-desc {
      font-size: 12px;
      color: #64748b;
      margin: 0;
    }
    
    /* Trainers Section */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }
    
    .search-box {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    #searchInput {
      width: 300px;
      background: #0f1419;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
    }
    
    #searchInput:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
    }
    
    .trainers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    
    .trainer-card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s;
      cursor: pointer;
    }
    
    .trainer-card:hover {
      border-color: #f59e0b;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
    }
    
    .trainer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    
    .trainer-avatar {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: white;
    }
    
    .trainer-info {
      flex: 1;
      margin-left: 16px;
    }
    
    .trainer-name {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 4px 0;
    }
    
    .trainer-email {
      font-size: 13px;
      color: #64748b;
      margin: 0;
    }
    
    .trainer-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .stat-item {
      background: #0f1419;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-item-value {
      font-size: 24px;
      font-weight: 700;
      color: #f59e0b;
      margin: 0 0 4px 0;
    }
    
    .stat-item-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0;
    }
    
    .trainer-actions {
      display: flex;
      gap: 8px;
    }
    
    .btn-view {
      flex: 1;
      background: #f59e0b;
      color: #000000;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-view:hover {
      background: #d97706;
      transform: translateY(-1px);
    }
    
    .btn-manage {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-manage:hover {
      background: #1e293b;
      border-color: #475569;
    }
    
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #64748b;
    }
    
    .empty-icon {
      font-size: 64px;
      opacity: 0.3;
      margin-bottom: 20px;
    }
    
    .empty-text {
      font-size: 16px;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    
    .empty-subtext {
      font-size: 14px;
      color: #64748b;
    }
    
    @media (max-width: 768px) {
      .dashboard-container {
        padding: 16px 20px;
      }
      
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .trainers-grid {
        grid-template-columns: 1fr;
      }
      
      #searchInput {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <div class="dashboard-header">
      <div class="header-left">
        <div class="app-icon">👑</div>
        <div class="header-title">
          <h1>Admin Dashboard</h1>
          <p class="header-subtitle">System overview and trainer management</p>
        </div>
      </div>
      <div class="header-right">
        <div class="user-info">
          <p class="user-name" id="userName">Loading...</p>
          <p class="user-role">Administrator</p>
        </div>
        <form id="logoutForm" style="margin:0;">
          <button type="submit" class="nav-btn">
            <span>↪</span> Logout
          </button>
        </form>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Trainers</div>
        <div class="stat-value blue" id="totalTrainers">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Users</div>
        <div class="stat-value purple" id="totalUsers">0</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <a href="admin-users.html" class="action-card">
        <div class="action-icon">👥</div>
        <h3 class="action-title">User Management</h3>
        <p class="action-desc">Manage all users and roles</p>
      </a>
    </div>

    <!-- Trainers Section -->
    <div class="section-header">
      <h2 class="section-title">All Trainers</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search trainers...">
      </div>
    </div>
    
    <div class="trainers-grid" id="trainersGrid">
      <div class="empty-state">
        <div class="empty-icon">👨‍🏫</div>
        <div class="empty-text">Loading trainers...</div>
      </div>
    </div>
  </div>

  <script src="admin-dashboard.js"></script>
</body>
</html>
