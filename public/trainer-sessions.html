<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Sessions</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
    }
    
    .dashboard-container {
      background: #0f1419;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 40px 60px;
      min-height: 100vh;
    }
    
    /* Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    
    .page-header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      text-align: left;
    }
    
    .header-actions {
      display: flex;
      gap: 12px;
    }
    
    .nav-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .nav-link:hover {
      background: #1e293b;
      border-color: #3b82f6;
      color: #60a5fa;
    }
    
    .section-subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 4px 0 0 0;
    }
    
    /* Sessions Table */
    .sessions-section {
      margin-bottom: 48px;
    }
    
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .table-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }
    
    .table-stats {
      font-size: 13px;
      color: #64748b;
      background: #1a1f2e;
      padding: 6px 14px;
      border-radius: 6px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      overflow: hidden;
    }
    
    table thead {
      background: #0f1419;
    }
    
    table th {
      padding: 16px 20px;
      text-align: left;
      font-weight: 600;
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #2d3748;
    }
    
    table td {
      padding: 18px 20px;
      color: #e2e8f0;
      font-size: 14px;
      border-bottom: 1px solid #2d3748;
      vertical-align: middle;
    }
    
    table tbody tr:last-child td {
      border-bottom: none;
    }
    
    table tbody tr {
      transition: all 0.2s;
    }
    
    table tbody tr:hover {
      background: rgba(59, 130, 246, 0.05);
    }
    
    table button {
      padding: 7px 14px;
      font-size: 12px;
      margin-right: 6px;
      border-radius: 6px;
      font-weight: 600;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    
    .empty-icon {
      font-size: 48px;
      opacity: 0.3;
      margin-bottom: 16px;
    }
    
    .empty-text {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    
    .empty-subtext {
      font-size: 13px;
      color: #64748b;
    }
    
    /* Create Session Section */
    .section-card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      padding: 28px 32px;
      border-radius: 12px;
      margin-top: 48px;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .section-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 2px;
    }
    
    /* Form Styling */
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    
    select {
      width: 100%;
      background: #0f1419;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    select option {
      background: #1a1f2e;
      color: #e2e8f0;
      padding: 8px;
    }
    
    /* Team Members Section */
    .team-section {
      background: #0f1419;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    
    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .team-label {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }
    
    .team-count {
      font-size: 12px;
      color: #64748b;
      background: #1a1f2e;
      padding: 4px 12px;
      border-radius: 6px;
    }
    
    #teamMembersContainer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .team-member-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 8px;
      transition: all 0.2s;
    }
    
    .team-member-row:hover {
      border-color: #3b82f6;
    }
    
    .team-member-row select,
    .team-member-row input {
      margin-bottom: 0;
      background: #0f1419;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .team-member-row input::placeholder {
      color: #64748b;
    }
    
    .team-member-row select:focus,
    .team-member-row input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }
    
    .team-member-row button {
      padding: 10px 14px;
      font-size: 12px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .team-member-row button:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }
    
    .add-member-btn {
      background: transparent;
      border: 1px dashed #475569;
      color: #94a3b8;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .add-member-btn:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: #3b82f6;
      color: #3b82f6;
      border-style: solid;
    }
    
    /* Form Actions */
    .form-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .btn-primary {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-secondary:hover {
      background: #1e293b;
      border-color: #475569;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .dashboard-container {
        padding: 16px 20px;
      }
      
      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      
      .team-member-row {
        grid-template-columns: 1fr;
      }
      
      table {
        font-size: 12px;
      }
      
      table th,
      table td {
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1>Session Management</h1>
        <p class="section-subtitle">Create and manage training sessions for your teams</p>
      </div>
      <div class="header-actions">
        <a href="trainer-dashboard.html" class="nav-link">
          <span>←</span> Dashboard
        </a>
        <a href="trainer-sessions-archived.html" class="nav-link">
          <span>📦</span> Archived
        </a>
      </div>
    </div>
    
    <!-- Sessions List (Now First) -->
    <div class="sessions-section">
      <div class="table-header">
        <h2 class="table-title">All Sessions</h2>
        <span class="table-stats" id="sessionCount">0 sessions</span>
      </div>
      
      <table id="sessionsTable">
        <thead>
          <tr>
            <th style="width: 25%;">Scenario</th>
            <th style="width: 30%;">Team Members</th>
            <th style="width: 15%;">Status</th>
            <th style="width: 30%;">Actions</th>
          </tr>
        </thead>
        <tbody id="sessionsBody">
          <tr>
            <td colspan="4">
              <div class="empty-state">
                <div class="empty-icon">📋</div>
                <div class="empty-text">No sessions created yet</div>
                <div class="empty-subtext">Create your first session below to get started</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Create Session Section (Now Below) -->
    <div class="section-card">
      <div class="section-header">
        <div>
          <h2 class="section-title">Create New Session</h2>
        </div>
      </div>
      
      <form id="sessionForm">
        <div class="form-group">
          <label class="form-label">Select Scenario</label>
          <select id="scenarioSelect" required>
            <option value="">Choose a scenario...</option>
          </select>
        </div>
        
        <div class="team-section">
          <div class="team-header">
            <h3 class="team-label">Team Members</h3>
            <span class="team-count" id="teamCountMsg">0 / 5 members</span>
          </div>
          
          <div id="teamMembersContainer">
            <!-- Team member rows will be added dynamically -->
          </div>
          
          <button type="button" id="addTeamMemberBtn" class="add-member-btn">
            <span>+</span> Add Team Member
          </button>
        </div>
        
        <div class="form-actions">
          <button type="button" id="createSessionBtn" class="btn-primary">
            <span>✓</span> Create Session
          </button>
          <button type="button" id="refreshBtn" class="btn-secondary">
            <span>↻</span> Refresh Data
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="trainer-sessions.js"></script>
</body>
</html>
