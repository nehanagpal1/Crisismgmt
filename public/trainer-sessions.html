<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Sessions</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
    }
    
    .dashboard-container {
      background: #0f1419;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 40px 60px;
      min-height: 100vh;
    }
    
    /* Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    
    .page-header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      text-align: left;
    }
    
    .header-actions {
      display: flex;
      gap: 12px;
    }
    
    .nav-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .nav-link:hover {
      background: #1e293b;
      border-color: #3b82f6;
      color: #60a5fa;
    }
    
    .section-subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 4px 0 0 0;
    }
    
    /* Sessions Table */
    .sessions-section {
      margin-bottom: 48px;
    }
    
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .table-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }
    
    .table-stats {
      font-size: 13px;
      color: #64748b;
      background: #1a1f2e;
      padding: 6px 14px;
      border-radius: 6px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      overflow: hidden;
    }
    
    table thead {
      background: #0f1419;
    }
    
    table th {
      padding: 16px 20px;
      text-align: left;
      font-weight: 600;
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #2d3748;
    }
    
    table td {
      padding: 18px 20px;
      color: #e2e8f0;
      font-size: 14px;
      border-bottom: 1px solid #2d3748;
      vertical-align: middle;
    }
    
    table tbody tr:last-child td {
      border-bottom: none;
    }
    
    table tbody tr {
      transition: all 0.2s;
    }
    
    table tbody tr:hover {
      background: rgba(59, 130, 246, 0.05);
    }
    
    table button {
      padding: 7px 14px;
      font-size: 12px;
      margin-right: 6px;
      border-radius: 6px;
      font-weight: 600;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    
    .empty-icon {
      font-size: 48px;
      opacity: 0.3;
      margin-bottom: 16px;
    }
    
    .empty-text {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    
    .empty-subtext {
      font-size: 13px;
      color: #64748b;
    }
    
    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 16px 0;
    }
    
    .pagination-btn {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      color: #e2e8f0;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 80px;
    }
    
    .pagination-btn:hover:not(:disabled) {
      background: #334155;
      border-color: #475569;
    }
    
    .pagination-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    .pagination-info {
      color: #64748b;
      font-size: 13px;
      margin: 0 12px;
    }
    
    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-secondary:hover {
      background: #1e293b;
      border-color: #475569;
    }
    
    .btn-archive {
      background: #f59e0b;
      color: #0f172a;
      border: none;
    }
    
    .btn-archive:hover {
      background: #d97706;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .dashboard-container {
        padding: 16px 20px;
      }
      
      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      
      .team-member-row {
        grid-template-columns: 1fr;
      }
      
      table {
        font-size: 12px;
      }
      
      table th,
      table td {
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading sessions...</div>
  </div>

  <div class="dashboard-container">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1>All Sessions</h1>
        <p class="section-subtitle">View and manage all training sessions (excluding archived)</p>
      </div>
      <div class="header-actions">
        <a href="trainer-dashboard.html" class="nav-link">
          <span>←</span> Dashboard
        </a>
        <a href="trainer-sessions-archived.html" class="nav-link">
          <span>📦</span> Archived
        </a>
      </div>
    </div>
    
    <!-- Sessions List (Now First) -->
    <div class="sessions-section">
      <div class="table-header">
        <h2 class="table-title">All Sessions</h2>
        <span class="table-stats" id="sessionCount">0 sessions</span>
      </div>
      
      <table id="sessionsTable">
        <thead>
          <tr>
            <th style="width: 25%;">Scenario</th>
            <th style="width: 30%;">Team Members</th>
            <th style="width: 15%;">Status</th>
            <th style="width: 30%;">Actions</th>
          </tr>
        </thead>
        <tbody id="sessionsBody">
          <tr>
            <td colspan="4">
              <div class="empty-state">
                <div class="empty-icon">📋</div>
                <div class="empty-text">No sessions created yet</div>
                <div class="empty-subtext">Create your first session below to get started</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div id="sessionsPagination"></div>
    </div>
    
  </div>
  
  <script src="trainer-sessions.js"></script>
</body>
</html>
