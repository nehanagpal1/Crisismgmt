<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" name="username" placeholder="Username" required><br>
      <input type="email" name="email" placeholder="Email (optional)"><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <select name="role" required style="width:94%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:4px;">
        <option value="user">User</option>
        <option value="trainer">Trainer</option>
        <option value="admin">Admin</option>
      </select><br>
      <button type="submit">Register</button>
    </form>
    <div id="regMessage"></div>
    <p style="font-size:14px;margin-top:12px;">Already have an account? <a href="index.html">Login</a></p>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const payload = {};
      for (let [key, value] of formData.entries()) payload[key] = value;
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      const msg = document.getElementById('regMessage');
      if(data.success) {
        msg.style.color = 'green';
        msg.textContent = 'Registration successful! Redirecting to login...';
        setTimeout(()=>{window.location='index.html';},1500);
      } else {
        msg.style.color = 'red';
        msg.textContent = data.message;
      }
    });
  </script>
</body>
</html>
