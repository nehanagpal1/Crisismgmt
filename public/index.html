<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Crisis Response Training</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .login-container {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      max-width: 440px;
      width: 100%;
      margin: 20px;
      padding: 40px 36px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    .app-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .app-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
    }
    
    .app-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 8px 0;
    }
    
    .app-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin: 0;
    }
    
    h2 {
      color: #ffffff;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 24px 0;
    }
    
    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #0f1419;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    input::placeholder {
      color: #64748b;
    }
    
    button[type="submit"] {
      width: 100%;
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    
    button[type="submit"]:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    button[type="submit"]:active {
      transform: translateY(0);
    }
    
    #loginMessage {
      margin: 16px 0 0 0;
      color: #10b981;
      min-height: 20px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    
    #loginMessage.error {
      color: #ef4444;
    }
    
    .register-link {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #2d3748;
      font-size: 14px;
      color: #94a3b8;
    }
    
    .register-link a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    
    .register-link a:hover {
      color: #60a5fa;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="app-header">
      <div class="app-icon">📊</div>
      <h1 class="app-title">Crisis Response Training</h1>
      <p class="app-subtitle">Sign in to your account</p>
    </div>
    
    <form id="loginForm">
      <input type="text" name="username" placeholder="Username" required autocomplete="username">
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Sign In</button>
    </form>
    
    <div id="loginMessage"></div>
    
    <div class="register-link">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
  </div>
  
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const payload = {};
      for (let [key, value] of formData.entries()) payload[key] = value;
      
      const msg = document.getElementById('loginMessage');
      msg.textContent = 'Signing in...';
      msg.className = '';
      
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if(data.success) {
          msg.className = '';
          msg.textContent = 'Login successful! Redirecting...';
          setTimeout(()=>{window.location = data.redirect;}, 700);
        } else {
          msg.className = 'error';
          msg.textContent = data.message || 'Login failed';
        }
      } catch(err) {
        msg.className = 'error';
        msg.textContent = 'Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
