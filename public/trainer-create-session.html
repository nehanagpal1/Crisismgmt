<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create New Session</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
    }
    
    .dashboard-container {
      background: #0f1419;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 40px 60px;
      min-height: 100vh;
    }
    
    .back-link {
      display: inline-block;
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: #60a5fa;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 8px 0;
    }
    
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin: 0 0 32px 0;
    }
    
    h3 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin: 24px 0 16px 0;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    
    select {
      width: 100%;
      background: #0f1419;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      transition: all 0.2s;
      box-sizing: border-box;
      font-family: inherit;
      cursor: pointer;
    }
    
    select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    select option {
      background: #1a1f2e;
      color: #e2e8f0;
    }
    
    /* Team Members Section */
    .team-section {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    
    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .team-label {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }
    
    .team-count {
      font-size: 12px;
      color: #64748b;
      background: #0f1419;
      padding: 4px 12px;
      border-radius: 6px;
    }
    
    #teamMembersContainer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .team-member-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: #0f1419;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    
    .team-member-row select,
    .team-member-row input {
      margin-bottom: 0;
      background: #0f1419;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .team-member-row input::placeholder {
      color: #64748b;
    }
    
    .team-member-row select:focus,
    .team-member-row input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }
    
    .team-member-row button {
      padding: 10px 14px;
      font-size: 18px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .team-member-row button:hover {
      background: #b91c1c;
    }
    
    .add-member-btn {
      background: transparent;
      border: 1px dashed #475569;
      color: #94a3b8;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .add-member-btn:hover {
      background: #1e293b;
      border-color: #3b82f6;
      color: #3b82f6;
    }
    
    .add-member-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    
    .btn-success {
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-success:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-secondary:hover {
      background: #1e293b;
      border-color: #475569;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <a href="trainer-dashboard.html" class="back-link" id="backLink">← Back to Dashboard</a>
    
    <h1>Create New Session</h1>
    <p class="subtitle">Start a new training session with a scenario and participants</p>

    <form id="createSessionForm">
      <h3>Select Scenario</h3>
      <label for="scenarioSelect">Scenario *</label>
      <select id="scenarioSelect" name="scenarioId" required>
        <option value="">Loading scenarios...</option>
      </select>

      <h3>Team Members</h3>
      <div class="team-section">
        <div class="team-header">
          <span class="team-label">Participants</span>
          <span class="team-count" id="teamCountMsg">0 / 5 members</span>
        </div>
        <div id="teamMembersContainer"></div>
        <button type="button" id="addTeamMemberBtn" class="add-member-btn">
          <span>+</span> Add Team Member
        </button>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-success">Create Session</button>
        <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
      </div>
    </form>
  </div>
  
  <script src="trainer-create-session.js"></script>
</body>
</html>
