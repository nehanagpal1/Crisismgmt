<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trainer Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
    }
    
    .dashboard-container {
      background: #0f1419;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 40px;
      min-height: 100vh;
    }
    
    /* Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .app-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    .header-title h1 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      text-align: left;
    }
    
    .header-subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 2px 0 0 0;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .back-btn {
      background: #f59e0b;
      border: 1px solid #f59e0b;
      color: #000000;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    
    .back-btn:hover {
      background: #d97706;
      border-color: #d97706;
      transform: translateY(-1px);
    }
    
    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px 24px;
      transition: all 0.3s;
    }
    
    .stat-card:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
    }
    
    .stat-label {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }
    
    .stat-value.blue { color: #3b82f6; }
    .stat-value.orange { color: #f59e0b; }
    .stat-value.gray { color: #94a3b8; }
    
    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 40px 0 20px 0;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }
    
    /* Active Sessions */
    .session-card-modern {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: all 0.3s;
    }
    
    .session-card-modern:hover {
      border-color: #3b82f6;
      transform: translateY(-1px);
    }
    
    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    
    .session-info h3 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 6px 0;
    }
    
    .session-meta {
      font-size: 13px;
      color: #64748b;
      margin: 4px 0;
    }
    
    .session-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .badge-live {
      background: #f59e0b;
      color: #000000;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .badge-live::before {
      content: '▶';
      font-size: 10px;
    }
    
    .participants-info {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 12px;
    }
    
    .btn-monitor {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-monitor:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    
    /* Scenarios */
    .scenario-card-modern {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: all 0.3s;
    }
    
    .scenario-card-modern:hover {
      border-color: #475569;
    }
    
    .scenario-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    
    .scenario-info h3 {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 8px 0;
      cursor: pointer;
    }
    
    .scenario-info h3:hover {
      color: #3b82f6;
    }
    
    .scenario-description {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    
    .scenario-details {
      font-size: 12px;
      color: #64748b;
    }
    
    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 8px;
    }
    
    .badge-draft {
      background: #334155;
      color: #94a3b8;
    }
    
    .badge-active {
      background: #065f46;
      color: #6ee7b7;
    }
    
    .badge-archived {
      background: #1e293b;
      color: #64748b;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    
    .empty-state-icon {
      font-size: 48px;
      opacity: 0.3;
      margin-bottom: 16px;
    }
    
    .empty-state-text {
      font-size: 14px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <div class="dashboard-header">
      <div class="header-left">
        <div class="app-icon">📊</div>
        <div class="header-title">
          <h1 id="trainerName">Trainer Dashboard</h1>
          <p class="header-subtitle">Trainer Dashboard</p>
        </div>
      </div>
      <div class="header-right">
        <a href="admin-dashboard.html" class="back-btn">
          <span>←</span> Back to Admin Dashboard
        </a>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Scenarios</div>
        <div class="stat-value" id="totalScenarios">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Scenarios</div>
        <div class="stat-value blue" id="activeScenarios">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Sessions</div>
        <div class="stat-value orange" id="activeSessions">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Draft Scenarios</div>
        <div class="stat-value gray" id="draftScenarios">0</div>
      </div>
    </div>

    <!-- Active Sessions -->
    <div class="section-header">
      <h2 class="section-title">Active Sessions</h2>
    </div>
    <div id="activeSessionsList">
      <div class="empty-state">
        <div class="empty-state-icon">💤</div>
        <div class="empty-state-text">No active sessions running</div>
      </div>
    </div>

    <!-- Scenarios -->
    <div class="section-header">
      <h2 class="section-title">Scenarios</h2>
    </div>
    <div id="scenarioList">
      <div class="empty-state">
        <div class="empty-state-icon">📋</div>
        <div class="empty-state-text">No scenarios created yet</div>
      </div>
    </div>
  </div>

  <script>
    // Get trainer ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const trainerId = urlParams.get('trainerId');

    if (!trainerId) {
      alert('No trainer specified');
      location.href = 'admin-dashboard.html';
    }

    // Ensure admin is logged in
    async function ensureAdmin() {
      const res = await fetch('/check-session');
      const data = await res.json();
      if (!data.loggedIn || data.role !== 'admin') {
        alert('Access denied. Admin privileges required.');
        location.href = '/';
        return null;
      }
      return data;
    }

    // Load trainer's scenarios
    async function loadTrainerScenarios() {
      try {
        const res = await fetch(`/api/admin/trainer/${trainerId}/scenarios`);
        if (!res.ok) throw new Error('Failed to load scenarios');
        return await res.json();
      } catch (err) {
        console.error('Error loading scenarios:', err);
        return [];
      }
    }

    // Load trainer's sessions
    async function loadTrainerSessions() {
      try {
        const res = await fetch(`/api/admin/trainer/${trainerId}/sessions`);
        if (!res.ok) throw new Error('Failed to load sessions');
        return await res.json();
      } catch (err) {
        console.error('Error loading sessions:', err);
        return [];
      }
    }

    // Load trainer info
    async function loadTrainerInfo() {
      try {
        const res = await fetch(`/api/admin/users`);
        if (!res.ok) throw new Error('Failed to load users');
        const users = await res.json();
        return users.find(u => u._id === trainerId);
      } catch (err) {
        console.error('Error loading trainer:', err);
        return null;
      }
    }

    // Calculate stats
    function calculateStats(scenarios, sessions) {
      const total = scenarios.length;
      const active = scenarios.filter(s => s.status === 'active').length;
      const draft = scenarios.filter(s => s.status === 'draft').length;
      const activeSessions = sessions.filter(s => s.status === 'active').length;
      
      return { total, active, draft, activeSessions };
    }

    // Render stats
    function renderStats(stats) {
      document.getElementById('totalScenarios').textContent = stats.total;
      document.getElementById('activeScenarios').textContent = stats.active;
      document.getElementById('activeSessions').textContent = stats.activeSessions;
      document.getElementById('draftScenarios').textContent = stats.draft;
    }

    // Render active sessions
    function renderActiveSessions(sessions) {
      const container = document.getElementById('activeSessionsList');
      const activeSessions = sessions.filter(s => s.status === 'active');
      
      if (activeSessions.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">💤</div>
            <div class="empty-state-text">No active sessions running</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = '';
      activeSessions.forEach(session => {
        const card = document.createElement('div');
        card.className = 'session-card-modern';
        
        let teamInfo = '';
        if (session.teamMembers && session.teamMembers.length > 0) {
          const teamCount = session.teamMembers.length;
          teamInfo = `${teamCount} participant${teamCount > 1 ? 's' : ''} active`;
        } else if (session.userId) {
          teamInfo = `1 participant active`;
        }
        
        card.innerHTML = `
          <div class="session-header">
            <div class="session-info">
              <h3>${session.scenarioId?.title || 'Untitled Scenario'}</h3>
              <div class="session-meta">Round ${session.currentRound || 1} of ${session.scenarioId?.numRounds || 5}</div>
              <div class="participants-info">${teamInfo}</div>
            </div>
            <div class="session-actions">
              <span class="badge-live">Live</span>
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // Render scenarios
    function renderScenarios(scenarios) {
      const container = document.getElementById('scenarioList');
      
      const visibleScenarios = scenarios.filter(s => s.status !== 'archived');
      
      if (visibleScenarios.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-text">No scenarios created yet</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = '';
      visibleScenarios.forEach(scenario => {
        const card = document.createElement('div');
        card.className = 'scenario-card-modern';
        
        let statusBadge = '';
        if (scenario.status === 'draft') {
          statusBadge = '<span class="badge-status badge-draft">draft</span>';
        } else if (scenario.status === 'active') {
          statusBadge = '<span class="badge-status badge-active">active</span>';
        } else if (scenario.status === 'archived') {
          statusBadge = '<span class="badge-status badge-archived">archived</span>';
        }
        
        card.innerHTML = `
          <div class="scenario-header">
            <div class="scenario-info">
              <h3>${scenario.title}</h3>
              <div class="scenario-description">${scenario.description || 'No description provided'}</div>
              <div class="scenario-details">
                ${statusBadge}
                Template: ${scenario.templateType || 'custom'} • 
                Rounds: ${scenario.numRounds || 5} • 
                Timer: ${scenario.responseTimerSec || 120}s
              </div>
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // Initialize
    ensureAdmin().then(async (admin) => {
      if (!admin) return;
      
      // Load trainer info
      const trainer = await loadTrainerInfo();
      if (trainer) {
        document.getElementById('trainerName').textContent = `${trainer.username}'s Dashboard`;
      }
      
      // Load data
      const [scenarios, sessions] = await Promise.all([
        loadTrainerScenarios(),
        loadTrainerSessions()
      ]);
      
      // Calculate and render stats
      const stats = calculateStats(scenarios, sessions);
      renderStats(stats);
      
      // Render active sessions
      renderActiveSessions(sessions);
      
      // Render scenarios
      renderScenarios(scenarios);
    });
  </script>
</body>
</html>
