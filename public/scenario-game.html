<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Training Session</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
    }
    
    .game-container {
      background: #0f1419;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 40px;
      min-height: 100vh;
    }
    
    /* Header */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    
    .header-left h1 {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 4px 0;
    }
    
    .header-subtitle {
      font-size: 13px;
      color: #64748b;
    }
    
    #customRole {
      display: inline-block;
      background: #065f46;
      color: #6ee7b7;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-left: 12px;
    }
    
    /* Round Info */
    .info-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
    }
    
    #roundInfo {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 500;
    }
    
    #timer {
      font-size: 14px;
      color: #f59e0b;
      font-weight: 600;
      padding: 6px 12px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 6px;
    }
    
    /* Scenario Block */
    .scenario-block {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-left: 4px solid #3b82f6;
      margin-bottom: 24px;
      padding: 24px;
      border-radius: 12px;
    }
    
    #scenarioText {
      font-size: 15px;
      line-height: 1.8;
      color: #e2e8f0;
    }
    
    /* Response Form */
    #responseForm {
      margin-bottom: 24px;
    }
    
    textarea {
      width: 100%;
      background: #0f1419;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      min-height: 120px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.6;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    textarea::placeholder {
      color: #64748b;
    }
    
    #submitEarlyBtn {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }
    
    #submitEarlyBtn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    
    #submitEarlyBtn:disabled {
      background: #334155;
      cursor: not-allowed;
      transform: none;
    }
    
    #autoSubmitMsg {
      color: #f59e0b;
      font-weight: 600;
      margin-top: 12px;
      font-size: 13px;
      padding: 12px 16px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 8px;
    }
    
    #waitingMsg {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid #f59e0b;
      color: #fbbf24;
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
    }
    
    #feedback {
      margin-top: 16px;
      color: #10b981;
      font-size: 14px;
      font-weight: 500;
    }
    
    .logout-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 24px;
    }
    
    .logout-btn:hover {
      background: #1e293b;
      border-color: #475569;
      transform: none;
    }
    
    /* Summary Container */
    .summary-container {
      background: #0f1419;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 40px;
      min-height: 100vh;
    }
    
    .summary-container h2 {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 32px 0;
    }
    
    #summaryRounds {
      margin-bottom: 32px;
    }
    
    #summaryRounds .scenario {
      font-weight: 600;
      color: #3b82f6;
      font-size: 14px;
      margin: 24px 0 8px 0;
    }
    
    #summaryRounds .response {
      margin-bottom: 16px;
      font-size: 14px;
      color: #94a3b8;
      padding: 16px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 8px;
      line-height: 1.6;
    }
    
    .summary-actions {
      display: flex;
      gap: 12px;
    }
    
    .btn-primary {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-secondary:hover {
      background: #1e293b;
      border-color: #475569;
      transform: none;
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading scenario...</div>
  </div>

  <div class="game-container" id="gameContainer">
    <div class="game-header">
      <div class="header-left">
        <h1>
          Training Session
          <span id="customRole" style="display:none;"></span>
        </h1>
        <div class="header-subtitle" id="userInfo"></div>
      </div>
    </div>
    
    <div class="info-bar">
      <div id="roundInfo">Round: <span id="roundNum">1</span>/5</div>
      <div id="timer">⏱ <span id="timeLeft">120</span>s remaining</div>
    </div>
    
    <div class="scenario-block">
      <div id="scenarioText">Loading scenario...</div>
    </div>
    
    <form id="responseForm">
      <textarea id="teamResponse" placeholder="Enter your response... (Ctrl+Enter to submit early)" required></textarea>
      <button type="submit" id="submitEarlyBtn">Submit Response</button>
      <div id="autoSubmitMsg" style="display:none;">⚠️ Auto-submitting when timer reaches 0...</div>
    </form>
    
    <div id="feedback"></div>
    <div id="waitingMsg" style="display:none;"></div>
    
  </div>
  
  <div class="summary-container" id="summaryContainer" style="display:none;">
    <h2>🎯 Session Complete</h2>
    <div id="summaryRounds"></div>
    <div class="summary-actions">
      <button onclick="location.href='/user-dashboard.html'" class="btn-primary">Back to Dashboard</button>
      <button onclick="logout()" class="btn-secondary">Logout</button>
    </div>
  </div>
  
  <script src="scenario.js"></script>
</body>
</html>
