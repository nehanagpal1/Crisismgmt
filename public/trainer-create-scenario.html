<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create New Scenario</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
    }
    
    .dashboard-container {
      background: #0f1419;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 40px 60px;
      min-height: 100vh;
    }
    
    .back-link {
      display: inline-block;
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: #60a5fa;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 8px 0;
    }
    
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin: 0 0 32px 0;
    }
    
    h3 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin: 24px 0 16px 0;
    }
    
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .template-option {
      background: #1a1f2e;
      border: 2px solid #2d3748;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      color: #e2e8f0;
      transition: all 0.2s;
    }
    
    .template-option:hover {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.05);
    }
    
    .template-option input[type="radio"] {
      accent-color: #3b82f6;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .template-option input[type="radio"]:checked + span {
      color: #3b82f6;
      font-weight: 600;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      background: #0f1419;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      transition: all 0.2s;
      box-sizing: border-box;
      font-family: inherit;
    }
    
    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    textarea {
      resize: vertical;
      line-height: 1.6;
    }
    
    .input-row {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    
    .input-col {
      flex: 1;
    }
    
    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    
    .btn-success {
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-success:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-secondary:hover {
      background: #1e293b;
      border-color: #475569;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <a href="trainer-dashboard.html" class="back-link">← Back to Dashboard</a>
    
    <h1>Create New Scenario</h1>
    <p class="subtitle">Design a realistic crisis simulation for your team</p>

    <form id="createScenarioForm">
      <h3>Template Type</h3>
      <div class="template-grid">
        <label class="template-option">
          <input type="radio" name="templateType" value="fire" checked>
          <span>🔥 Fire Emergency</span>
        </label>
        <label class="template-option">
          <input type="radio" name="templateType" value="theft">
          <span>🚨 Theft</span>
        </label>
        <label class="template-option">
          <input type="radio" name="templateType" value="cyber">
          <span>💻 Cyber Attack</span>
        </label>
        <label class="template-option">
          <input type="radio" name="templateType" value="civil_unrest">
          <span>⚠️ Civil Unrest</span>
        </label>
        <label class="template-option">
          <input type="radio" name="templateType" value="natural_disaster">
          <span>🌪️ Natural Disaster</span>
        </label>
        <label class="template-option">
          <input type="radio" name="templateType" value="custom">
          <span>✏️ Custom Scenario</span>
        </label>
      </div>

      <h3>Scenario Title</h3>
      <input type="text" name="title" placeholder="e.g., Fire in Manufacturing Area" required>

      <h3>Description</h3>
      <textarea name="description" placeholder="Brief overview of the scenario..." rows="3"></textarea>

      <h3>Initial Situation</h3>
      <textarea name="initialText" placeholder="Describe the starting situation in detail..." rows="4" required></textarea>

      <div class="input-row">
        <div class="input-col">
          <label>Number of Rounds</label>
          <input type="number" name="numRounds" value="5" min="1" max="20">
        </div>
        <div class="input-col">
          <label>Response Timer (seconds)</label>
          <input type="number" name="responseTimerSec" value="120" min="10" max="900">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-success">Create Scenario</button>
        <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
      </div>
    </form>
  </div>
  
  <script src="trainer-create-scenario.js"></script>
</body>
</html>
