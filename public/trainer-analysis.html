<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trainer Analysis</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .analysis-section { 
      border: 1px solid #e2e8f0; 
      border-radius: 8px; 
      padding: 18px; 
      margin-bottom: 18px; 
      background: #f8fafc; 
    }
    .section-title { 
      font-size: 15px; 
      font-weight: 600; 
      color: #475569;
      margin-bottom: 12px;
    }
    .field-label { 
      font-weight: 600; 
      margin-top: 10px; 
      display: block;
      font-size: 13px;
      color: #475569;
    }
    .form-row { 
      margin-bottom: 12px; 
    }
    .analysis-section textarea {
      min-height: 60px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trainer Analysis Form</h1>
    
    <div id="sessionInfo" style="background:#dbeafe;border:1px solid #0ea5e9;padding:16px;border-radius:8px;margin-bottom:20px;">
      <h3 style="margin:0 0 10px 0;color:#1e40af;font-size:15px;">Session Information</h3>
      <div id="sessionDetails" style="font-size:13px;color:#334155;"></div>
    </div>
    
    <h2>Team Responses by Round</h2>
    <div id="responsesSection" style="margin-bottom:24px;">
      <!-- Responses will be displayed grouped by round with team member names -->
    </div>
    
    <h2>Analysis</h2>
    <form id="analysisForm">
      <div class="analysis-section">
        <div class="section-title">1. Behavioural Interpretation</div>
        <div class="form-row">
          <label class="field-label">Emotional Tone</label>
          <textarea id="emotionalTone" name="emotionalTone"></textarea>
        </div>
        <div class="form-row">
          <label class="field-label">Cognitive State</label>
          <textarea id="cognitiveState" name="cognitiveState"></textarea>
        </div>
        <div class="form-row">
          <label class="field-label">Behavioural Signals</label>
          <textarea id="behaviouralSignals" name="behaviouralSignals"></textarea>
        </div>
      </div>
      <div class="analysis-section">
        <div class="section-title">2. What could have been better</div>
        <textarea id="whatCouldBeBetter" name="whatCouldBeBetter"></textarea>
      </div>
      <div class="analysis-section">
        <div class="section-title">3. How each team performed</div>
        <textarea id="teamPerformance" name="teamPerformance"></textarea>
      </div>
      <div style="display:flex;gap:12px;">
        <button type="button" id="completeBtn" class="btn-success">Submit Analysis & Mark Complete</button>
        <button type="button" id="backBtn" class="btn-secondary">Back</button>
      </div>
      <div id="feedbackMsg" style="margin-top:18px; color:#059669;font-weight:600;font-size:13px;"></div>
    </form>
  </div>
  <script src="trainer-analysis.js"></script>
</body>
</html>
