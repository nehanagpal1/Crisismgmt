<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Response and Analysis</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1419;
      color: #e2e8f0;
    }
    
    .dashboard-container {
      background: #0f1419;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 40px;
      min-height: 100vh;
    }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      text-align: left;
    }
    
    .header-actions {
      display: flex;
      gap: 12px;
    }
    
    .nav-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .nav-link:hover {
      background: #1e293b;
      border-color: #3b82f6;
      color: #60a5fa;
    }
    
    #info {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #94a3b8;
    }
    
    h2 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin: 32px 0 16px 0;
      text-align: left;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      overflow: hidden;
    }
    
    table thead {
      background: #0f1419;
    }
    
    table th {
      padding: 16px 20px;
      text-align: left;
      font-weight: 600;
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #2d3748;
    }
    
    table td {
      padding: 18px 20px;
      color: #e2e8f0;
      font-size: 14px;
      border-bottom: 1px solid #2d3748;
      vertical-align: top;
    }
    
    table tbody tr:last-child td {
      border-bottom: none;
    }
    
    table tbody tr:hover {
      background: rgba(59, 130, 246, 0.05);
    }
    
    #analysisSection {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      padding: 20px 24px;
      border-radius: 12px;
      margin-top: 16px;
    }
    
    #analysisSection h3 {
      font-size: 16px;
      font-weight: 600;
      color: #3b82f6;
      margin: 0 0 12px 0;
    }
    
    #analysisSection p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.7;
      margin: 8px 0;
    }
    
    #analysisSection strong {
      color: #cbd5e1;
      font-weight: 600;
    }
    
    .analysis-empty {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading responses...</div>
  </div>

  <div class="dashboard-container">
    <div class="page-header">
      <h1>Response and Analysis</h1>
      <div class="header-actions">
        <a href="/user-dashboard.html" class="nav-link">
          <span>←</span> Back to Dashboard
        </a>
      </div>
    </div>

    <div id="info">Loading session info...</div>

    <h2>Team Responses</h2>
    <table>
      <thead>
        <tr>
          <th style="width:80px;">Round</th>
          <th style="width:35%;">Scenario</th>
          <th>Response</th>
        </tr>
      </thead>
      <tbody id="respBody"></tbody>
    </table>

    <h2>Trainer Analysis</h2>
    <div id="analysisSection">
      <div class="analysis-empty">Trainer analysis will appear here once published.</div>
    </div>
  </div>

  <script src="user-session-responses.js"></script>
</body>
</html>
